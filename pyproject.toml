[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authorized-surface-scanner"
version = "0.1.0"
description = "Authorized, non-destructive network surface and vulnerability assessment tool"
requires-python = ">=3.11"

[project.scripts]
surface-scan = "surface_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
